  <section class="news06 cid-u9o85bmQxG" id="news06-4c">
    <div class="container">
      <h3 class="align-center mb-4 display-2"><strong data-translate="title"></strong></h3>
      <div id="papers-container"></div>
    </div>

    <script src="data/papers.js"></script>
    <script>
      function openSelectLanguage() {
        document.getElementById("list-language").classList.add("ls-lang");
      }

      function renderPapers(lang) {
        var btnLabel = lang === 'pt' ? 'Clique aqui para acessar o artigo' : 'Click here to access this paper';
        var years = [];
        papers.forEach(function(p) {
          if (years.indexOf(p.year) === -1) years.push(p.year);
        });
        years.sort(function(a, b) { return b - a; });

        var container = document.getElementById('papers-container');
        if (!container) return;

        container.innerHTML = years.map(function(year) {
          var yearPapers = papers.filter(function(p) { return p.year === year; });
          var papersHtml = yearPapers.map(function(p) {
            return '<div class="item-wrapper mt-3">' +
              '<div class="row align-items-start">' +
              '<div class="col-lg-6 col-md-12 image-wrapper">' +
              '<img class="w-100" src="' + p.img + '" alt="' + p.title + '">' +
              '</div>' +
              '<div class="col-lg-6 col-md-12" id="titlePapers">' +
              '<h5 class="display-5"><strong>' + p.title + '</strong></h5>' +
              '<p class="display-7 mt-5 mb-5">' + p.authors + '</p>' +
              '<p class="display-7 mt-5 mb-5"><em>' + p.journal + '</em></p>' +
              '<a href="' + p.link + '" target="_blank" class="display-7 paper-link"><em>' + btnLabel + '</em></a>' +
              '</div></div></div>';
          }).join('');

          return '<div class="row justify-content-center align-items-center item features-image mb-3">' +
            '<div class="col-12">' +
            '<button type="button" class="collapsible pb-0 pt-0 mb-0">' +
            '<h3 class="display-2"><strong><hr><span class="yr">' + year + '</span><hr></strong></h3>' +
            '</button>' +
            '<div class="content">' + papersHtml + '</div>' +
            '</div></div>';
        }).join('');
      }

      function onLanguageChange(lang) { renderPapers(lang); }
      renderPapers(localStorage.getItem('language') || 'pt');

      document.getElementById('papers-container').addEventListener('click', function(e) {
        var btn = e.target.closest('.collapsible');
        if (!btn) return;
        btn.classList.toggle('active');
        var content = btn.nextElementSibling;
        if (content) content.style.display = content.style.display === 'block' ? 'none' : 'block';
      });
    </script>
  </section>
