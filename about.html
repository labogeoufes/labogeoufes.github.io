    <script>
    (function () {
      const gallery = document.querySelector('.about-gallery');
      if (!gallery) return;

      const images = Array.from(gallery.querySelectorAll('img'));

      const imagePool = [
        'assets/images/about/lab-fieldwork-960x719.jpg',
        'assets/images/about/labogeo_churras.jpeg',
        'assets/images/about/sunset-960x1280.jpeg',
        'assets/images/about/projetos.png',        
        'assets/images/about/royalcharlotte02.jpeg',
        'assets/images/about/royalcharlotte03.jpeg',
        'assets/images/about/royalcharlotte04.jpeg',
        'assets/images/about/r2sonic2.jpeg',
        'assets/images/about/ctdswift2.jpg',
        'assets/images/about/lab-group-1-6000x4000.jpg',
      ];

      function pickSix() {
        const shuffled = [...imagePool].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 6);
      }

      function applyImages() {
        const selected = pickSix();
        images.forEach((img, i) => { img.src = selected[i]; });
      }

      applyImages();

      let queue = [];

      function refillQueue() {
        queue = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
      }

      function changeOne(idx) {
        const img = images[idx];
        const shown = new Set(images.map(m => m.src.split('/').pop()));
        const available = imagePool.filter(s => !shown.has(s.split('/').pop()));
        const pool = available.length > 0 ? available : imagePool.filter(s => s.split('/').pop() !== img.src.split('/').pop());
        const newSrc = pool[Math.floor(Math.random() * pool.length)];

        img.style.transition = 'transform 0.4s ease-in';
        img.style.transform = 'perspective(600px) rotateY(90deg)';

        setTimeout(() => {
          img.src = newSrc;
          img.style.transition = 'transform 0.4s ease-out';
          img.style.transform = 'perspective(600px) rotateY(0deg)';
        }, 400);
      }

      function scheduleNext() {
        if (queue.length === 0) refillQueue();
        const idx = queue.shift();
        changeOne(idx);
        setTimeout(scheduleNext, 3000 + Math.random() * 3000);
      }

      setTimeout(scheduleNext, 1000);
    })();
    </script>
