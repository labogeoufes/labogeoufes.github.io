        <script src="data/projects.js"></script>
        <script rel="text/javascript">
            const ITEMS_PER_PAGE = 6;
            let currentFilter = "ongoing";
            let currentPage = 1;

            function openSelectLanguage() {
                let ul = document.getElementById("list-language");
                ul.classList.add("ls-lang");
            }

            function toggleFilterDropdown() {
                const toggle = document.getElementById("filterDropdownToggle");
                const container = document.getElementById("myBtnContainer");
                toggle.classList.toggle("open");
                container.classList.toggle("open");
            }

            function filterSelection(c) {
                currentFilter = c;
                currentPage = 1;

                // Update active button
                const btns = document.getElementsByClassName("btn-filter-projects");
                for (let b of btns) b.classList.remove("active");
                const target = c === "terminated" ? btns[1] : btns[0];
                if (target) target.classList.add("active");

                // Close dropdown and update label on mobile
                const toggle = document.getElementById("filterDropdownToggle");
                const container = document.getElementById("myBtnContainer");
                if (toggle) toggle.classList.remove("open");
                if (container) container.classList.remove("open");
                const label = document.getElementById("filterDropdownLabel");
                if (label && target) label.textContent = target.textContent;

                renderPage();
            }

            function changePage(dir) {
                const cols = Array.from(document.getElementsByClassName("column"))
                    .filter(el => el.classList.contains(currentFilter));
                const totalPages = Math.ceil(cols.length / ITEMS_PER_PAGE);
                currentPage = Math.min(Math.max(currentPage + dir, 1), totalPages);
                renderPage();
            }

            function renderPage() {
                const cols = Array.from(document.getElementsByClassName("column"));
                const filtered = cols.filter(el => el.classList.contains(currentFilter));
                const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                const end = start + ITEMS_PER_PAGE;

                // Hide all, then show current page slice
                cols.forEach(el => el.classList.remove("show"));
                filtered.slice(start, end).forEach(el => el.classList.add("show"));

                // Pagination controls
                const pagination = document.getElementById("proj-pagination");
                const prevBtn = document.getElementById("proj-prev");
                const nextBtn = document.getElementById("proj-next");
                const info = document.getElementById("proj-page-info");

                pagination.style.display = totalPages > 1 ? "flex" : "none";
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
                info.textContent = currentPage + " / " + totalPages;
            }

            function renderProjects(lang) {
                var grid = document.getElementById('proj-grid');
                if (!grid) return;
                var lbl = projectLabels[lang];
                grid.innerHTML = projects.map(function(p) {
                    var t = p[lang];
                    return '<div class="column ' + p.status + '">' +
                        '<div class="content">' +
                        '<h2 class="align-center display-7"><strong>' + t.title + '</strong></h2>' +
                        '<div class="proj_text">' +
                        '<p><strong>' + lbl.time + '</strong> ' + t.time + '</p>' +
                        '<p><strong>' + lbl.fund + '</strong> ' + t.fund + '</p>' +
                        '<p><strong>' + lbl.memb + '</strong> ' + t.memb + '</p>' +
                        '</div></div></div>';
                }).join('');
                filterSelection(currentFilter);
            }

            function onLanguageChange(lang) { renderProjects(lang); }
            renderProjects(localStorage.getItem('language') || 'pt');
        </script>
