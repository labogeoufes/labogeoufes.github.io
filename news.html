  <script rel="text/javascript">
    function openSelectLanguage() {
       let ul = document.getElementById("list-language")
       ul.classList.add("ls-lang") 
     }
     let slideIndex = 1;
     let autoTimer = setInterval(autoAdvance, 3000);

     function showSlides(n) {
       let slides = document.getElementsByClassName("mySlides");
       let dots   = document.getElementsByClassName("dot");
       if (n > slides.length) { slideIndex = 1; }
       if (n < 1) { slideIndex = slides.length; }
       for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
       for (let i = 0; i < dots.length;   i++) dots[i].classList.remove("active");
       slides[slideIndex - 1].style.display = "block";
       dots[slideIndex - 1].classList.add("active");
     }

     function autoAdvance() { showSlides(++slideIndex); }

     function currentSlide(n) {
       clearInterval(autoTimer);
       showSlides(slideIndex = n);
       autoTimer = setInterval(autoAdvance, 3000);
     }

     showSlides(slideIndex);
  </script>
