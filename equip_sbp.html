<script>
    function openSelectLanguage() {
        let ul = document.getElementById("list-language")
        ul.classList.add("ls-lang") 
      }
    let slideIndex = 1;
    showSlides(slideIndex);
    setInterval(function() { plusSlides(1); }, 4000);

    // Next/previous controls
    function plusSlides(n) {
    showSlides(slideIndex += n);
    }

    // Thumbnail image controls
    function currentSlide(n) {
    showSlides(slideIndex = n);
    }

    function showSlides(n) {
    let i;
    let slides = document.getElementsByClassName("mySlides");
    if (n > slides.length) {slideIndex = 1}
    if (n < 1) {slideIndex = slides.length}
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }
    slides[slideIndex-1].style.display = "block";
    }
  </script>

      var EQUIP_SLUG = 'equip_sbp';
      function renderEquipDetail(lang) {
        var d = equipmentDetail[EQUIP_SLUG][lang];
        var titleEl = document.getElementById('equip-detail-title');
        var descEl  = document.getElementById('equip-detail-desc');
        var crumbEl = document.getElementById('equip-detail-crumb');
        if (titleEl) titleEl.textContent = d.title;
        if (descEl)  descEl.innerHTML = d.desc.split('\n\n').map(function(s) { return s.trim(); }).filter(Boolean).join('</p><p>');
        if (crumbEl) crumbEl.textContent = d.crumb;
      }
      function onLanguageChange(lang) { renderEquipDetail(lang); }
      renderEquipDetail(localStorage.getItem('language') || 'pt');
    </script>
