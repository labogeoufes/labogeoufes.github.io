        <script>
            function toggleFilterDropdown() {
                document.getElementById("myBtnContainer").classList.toggle("open");
                document.getElementById("filterDropdownToggle").classList.toggle("open");
            }

            function openSelectLanguage() {
                let ul = document.getElementById("list-language");
                ul.classList.add("ls-lang");
            }

            var teamPage = 1;
            var TEAM_PER_PAGE = 5;
            var EGR_PER_PAGE = 1;
            var teamCurrentFilter = 'dosc';

            function filterSelection(c) {
                teamCurrentFilter = c;
                teamPage = 1;
                var selected = document.getElementById(c);
                if (selected) document.getElementById("filterDropdownLabel").textContent = selected.textContent;
                document.getElementById("myBtnContainer").classList.remove("open");
                document.getElementById("filterDropdownToggle").classList.remove("open");
                renderTeamPage();
            }

            function renderTeamPage() {
                var allContent = Array.from(document.getElementsByClassName("content"));
                var filtered = allContent.filter(function(el) { return el.classList.contains(teamCurrentFilter); });
                var perPage = teamCurrentFilter === 'egr' ? EGR_PER_PAGE : TEAM_PER_PAGE;
                var totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
                var start = (teamPage - 1) * perPage;
                allContent.forEach(function(el) { el.classList.add("hidden"); });
                filtered.slice(start, start + perPage).forEach(function(el) { el.classList.remove("hidden"); });
                var pagination = document.getElementById("team-pagination");
                var prevBtn = document.getElementById("team-prev");
                var nextBtn = document.getElementById("team-next");
                var info = document.getElementById("team-page-info");
                if (pagination) pagination.style.display = totalPages > 1 ? "flex" : "none";
                if (prevBtn) prevBtn.disabled = teamPage === 1;
                if (nextBtn) nextBtn.disabled = teamPage === totalPages;
                if (info) info.textContent = teamPage + " / " + totalPages;
                scheduleScaleTeam();
            }

            function changeTeamPage(dir) {
                var allContent = Array.from(document.getElementsByClassName("content"));
                var filtered = allContent.filter(function(el) { return el.classList.contains(teamCurrentFilter); });
                var perPage = teamCurrentFilter === 'egr' ? EGR_PER_PAGE : TEAM_PER_PAGE;
                var totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
                teamPage = Math.min(Math.max(teamPage + dir, 1), totalPages);
                renderTeamPage();
            }

            function w3AddClass(element, name) {
                var arr1 = element.className.split(" ");
                var arr2 = name.split(" ");
                for (var i = 0; i < arr2.length; i++) {
                    if (arr1.indexOf(arr2[i]) == -1) element.className += " " + arr2[i];
                }
            }
            function w3RemoveClass(element, name) {
                var arr1 = element.className.split(" ");
                var arr2 = name.split(" ");
                for (var i = 0; i < arr2.length; i++) {
                    while (arr1.indexOf(arr2[i]) > -1) arr1.splice(arr1.indexOf(arr2[i]), 1);
                }
                element.className = arr1.join(" ");
            }

            var btnContainer = document.getElementById("myBtnContainer");
            var btns = btnContainer.getElementsByClassName("btn");
            for (var i = 0; i < btns.length; i++) {
                btns[i].addEventListener("click", function(e) {
                    var id = e.target.attributes.id.value;
                    var previous = document.getElementsByClassName("btn active");
                    var current = document.getElementById(id);
                    w3RemoveClass(previous[0], "active");
                    w3AddClass(current, "active");
                });
            }

            var teamBaseWidth = 1400;
            var _resizeObserver = null;

            function scaleTeam() {
                var inner = document.getElementById('team-inner');
                var outer = document.getElementById('team-outer');
                if (!inner || !outer) return;
                var scale = outer.offsetWidth / teamBaseWidth;

                inner.style.transform = 'scale(' + scale + ')';
                inner.style.transformOrigin = 'top left';

                if (_resizeObserver) _resizeObserver.disconnect();
                outer.style.height = (inner.scrollHeight * scale) + 'px';
                if (_resizeObserver) {
                    var outerEl = document.getElementById('team-outer');
                    if (outerEl) _resizeObserver.observe(outerEl);
                }
            }

            function scheduleScaleTeam() {
                requestAnimationFrame(function() {
                    requestAnimationFrame(scaleTeam);
                });
            }

            window.addEventListener('resize', scheduleScaleTeam);
            window.addEventListener('load', scheduleScaleTeam);
            document.addEventListener('click', function(e) {
                if (e.target.closest('#myBtnContainer')) scheduleScaleTeam();
            });

            (function() {
                var _debounceTimer = null;
                _resizeObserver = new ResizeObserver(function() {
                    clearTimeout(_debounceTimer);
                    _debounceTimer = setTimeout(scheduleScaleTeam, 16);
                });
                var outer = document.getElementById('team-outer');
                if (outer) _resizeObserver.observe(outer);
            }());

            function renderTeam(lang) {
                var labels = {
                    pt: { pos: 'P\u00F3s-Doutorado', doc: 'Doutorado', mast: 'Mestrado', grad: 'Gradua\u00E7\u00E3o' },
                    en: { pos: 'Post-Doctoral Research', doc: 'Doctoral Studies', mast: "Master's Studies", grad: 'Undergraduate Studies' }
                };
                var contactText = lang === 'pt' ? 'Contato' : 'Contact';
                var memberHtml = members.map(function(m) {
                    var t = m[lang];
                    var degrees = t.degrees.map(function(d) {
                        return '<p class="mbr-text display-8 mt-2">' + d + '</p>';
                    }).join('');
                    var emailBtn = m.email
                        ? '<button id="contact"><a href="mailto:' + m.email + '">' + contactText + '</a></button>'
                        : '';
                    var bioHtml = t.bio.split('\n').filter(function(s) { return s.trim(); }).map(function(s) {
                        return '<p class="mbr-text display-7">' + s.trim() + '</p>';
                    }).join('');
                    var titleHtml = t.title.replace(/\n/g, '<br>');
                    return '<div class="content ' + m.category + '">' +
                        '<div class="item features-image"><div class="item-wrapper"><div class="row">' +
                        '<div class="col-12 col-md-4"><div class="image-wrapper">' +
                        '<img src="' + m.photo + '" alt="NO IMAGE" onload="scheduleScaleTeam()">' +
                        degrees + emailBtn +
                        '</div></div>' +
                        '<div class="col"><div class="card-box">' +
                        '<h5 class="card-title m-0 mb-3 display-5" id="card-title"><strong>' + t.name + '</strong></h5>' +
                        '<h6 class="card-subtitle mb-3 display-4"><strong>' + titleHtml + '</strong></h6>' +
                        bioHtml +
                        '</div></div></div></div></div></div>';
                }).join('');
                var egrLevels = ['pos', 'doc', 'mast', 'grad'];
                var egrHtml = egrLevels.map(function(level) {
                    var entries = alumni.filter(function(a) { return a.level === level; });
                    if (entries.length === 0) return '';
                    var rows = entries.map(function(a) {
                        return level === 'pos'
                            ? '<p><strong>' + a.name + ' (' + a.year + ')</strong></p>'
                            : '<p><strong>' + a.name + '</strong> - ' + a.thesis + ' (' + a.year + ')</p>';
                    }).join('');
                    return '<div class="content egr">' +
                        '<div class="item features-image"><div class="item-wrapper">' +
                        '<div class="egr-content">' +
                        '<h6 class="card-title mb-3 display-6"><strong>' + labels[lang][level] + '</strong></h6>' +
                        rows +
                        '</div></div></div></div>';
                }).join('');
                var activeBtn = document.querySelector('#myBtnContainer .btn.active');
                teamCurrentFilter = activeBtn ? activeBtn.id : 'dosc';
                teamPage = 1;
                document.getElementById('team-cards').innerHTML = memberHtml + egrHtml;
                renderTeamPage();
            }

            function onLanguageChange(lang) { renderTeam(lang); }

            renderTeam(localStorage.getItem('language') || 'pt');

        </script>
