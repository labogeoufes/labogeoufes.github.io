    <script>
      function toggleFilterDropdown() {
        const toggle = document.getElementById("filterDropdownToggle");
        const container = document.getElementById("myBtnContainer");
        toggle.classList.toggle("open");
        container.classList.toggle("open");
      }

      function filterSelection(c) {
        var x = document.getElementsByClassName("column");
        for (var i = 0; i < x.length; i++) {
          x[i].classList.add("hide");
          x[i].classList.remove("show");
          if (x[i].className.indexOf(c) > -1) {
            x[i].classList.add("show");
            x[i].classList.remove("hide");
          }
        }
        var btns = document.getElementsByClassName("btn");
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.remove("active");
          if (btns[i].id === c) btns[i].classList.add("active");
        }
        var activeBtn = document.getElementById(c);
        var label = document.getElementById("filterDropdownLabel");
        if (activeBtn && label) label.textContent = activeBtn.textContent;
        document.getElementById("filterDropdownToggle").classList.remove("open");
        document.getElementById("myBtnContainer").classList.remove("open");
      }

      function renderEquipment(lang) {
        var grid = document.getElementById("equip-grid");
        if (!grid) return;
        var activeBtn = document.querySelector('#myBtnContainer .btn.active');
        var currentFilter = activeBtn ? activeBtn.id : 'din-mar';
        grid.innerHTML = equipment.map(function(e) {
          return '<div class="column ' + e.category + '">' +
            '<div class="content">' +
            '<a href="' + e.link + '"><img loading="lazy" src="' + e.img + '" alt="' + e[lang] + '" class="img-equip"></a>' +
            '<h2 class="align-center display-7"><strong>' + e[lang] + '</strong></h2>' +
            '</div></div>';
        }).join('');
        filterSelection(currentFilter);
      }

      function onLanguageChange(lang) { renderEquipment(lang); }

      renderEquipment(localStorage.getItem('language') || 'pt');
    </script>
