    <script>
      function renderResearch(lang) {
        var container = document.getElementById('rsc-cards');
        if (!container) return;
        container.innerHTML = researchCards.map(function(c) {
          var t = c[lang];
          var topics = t.topics.map(function(topic) {
            return '<li>' + topic + '</li>';
          }).join('');
          return '<div class="rsc-card item-mb active" data-filter="all">' +
            '<ul class="card-text display-7">' + topics + '</ul>' +
            '<div class="rsc-card-img"><img src="' + c.img + '" alt=""></div>' +
            '<div class="rsc-card-content"><h5 class="card-title display-7"><strong>' + t.title + '</strong></h5></div>' +
            '</div>';
        }).join('');
      }

      function onLanguageChange(lang) { renderResearch(lang); }
      renderResearch(localStorage.getItem('language') || 'pt');
    </script>
